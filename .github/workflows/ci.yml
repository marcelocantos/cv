# PR/push gate for master. Branch protection that requires this check is an
# owner action (GitHub settings), not a file in the tree.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
