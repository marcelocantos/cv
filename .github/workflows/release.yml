name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          for pair in darwin/arm64 linux/amd64 linux/arm64; do
            os="${pair%/*}"
            arch="${pair#*/}"
            GOOS=$os GOARCH=$arch go build -ldflags "-s -w -X main.version=${GITHUB_REF#refs/tags/}" -o cv ./cmd/cv
            tar czf "cv-${version}-${os}-${arch}.tar.gz" cv completions/
            rm cv
          done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          # Create release if it doesn't exist yet
          gh release create "$tag" --title "$tag" --generate-notes 2>/dev/null || true
          gh release upload "$tag" cv-${version}-*.tar.gz --clobber
