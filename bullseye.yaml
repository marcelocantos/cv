  T2.2:
    name: '`[scan]` runs before dry-run and staleness, and is a graph node'
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - (a) `cv -n` on a `[scan:]` rule must not spawn the scan command; (b) second `cv` on an up-to-date scanned target must not re-run the scan.
    - 'ENT-002 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-002 (P1). Status: observed fact. Two failures share one shape. (1) `cv -n` still executes scan commands. (2) Every visit of a scanned target re-runs the compiler-style pre-pass, even when the heavy recipe is up to date — the opposite of "record-and-reuse is the spine" (DESIGN.md §11). Scan is an inline side effect, not a node with its own recorded recipe/inputs. Remediation: Skip `runScan` when `dryRun`. For incremental: either treat scan as its own recorded node (matches the spec) or run it only when the parent is already stale-or-forced. Prefer the skip-unless-stale placement first; promoting scan to a real node is a follow-up if… Blast: any rule with `[scan: …]`. Dry-run is no longer a pure print. Incremental builds pay a full analysis cost per target per invocation. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-002
    - p1
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
  T2.3:
    name: Cyclic graphs deadlock in `Executor.Build`
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - '`a: b` / `b: a` must error; diamond must still pass; a test must not use a timeout as the oracle (error string is the oracle).'
    - 'ENT-003 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-003 (P1). Status: observed fact (mechanism); hang not reproduced in this run (would not terminate). For `a: b` and `b: a`, A inserts itself into `building` and waits for B; B finds A in `building` and waits on A''s `done`. Neither closes. The process hangs with no error. Remediation: thread a `buildingStack` (or colour) through `Build`; if `target` is on the current goroutine''s stack, return `fmt.Errorf("cycle involving %q", …)` instead of waiting. Keep the singleflight map for sibling diamond dedup. Blast: any cvfile with a cycle, including accidental self-prereqs and pattern-generated loops. Operator-visible hang, not a structured error. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-003
    - p1
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
