    context: 'Entropy-audit ENT-010 (P2). Status: observed fact. Authors following Make habits or DESIGN.md will believe `@` hides a line. It never does. STABILITY calling it Stable freezes a no-op. Remediation: either implement per-line silent under `-v`/`-n`, or demote `@` in STABILITY/DESIGN to "accepted no-op / stripped for Make familiarity". Blast: cosmetic for default (non-verbose) runs, where recipes are not echoed anyway; misleading under `-v`. Report: docs/audits/entropy-audit-2026-08-22.md.'
