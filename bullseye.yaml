  T2.1:
    name: Declared output content-hash is recorded and never consulted
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - that test on the library path; a CLI journey `cv && echo dirty > $target && cv` must rebuild.
    - 'ENT-001 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-001 (P1). Status: observed fact. After a successful build, a user (or another tool) can overwrite the artefact. The next `cv` sees the file still exists, input hashes unchanged, and skips the recipe. Downstream targets that list it as a prereq *will* rebuild (their input hash changes) against the tampered bytes; the declared target itself is not restored. Remediation: In `IsStale`/`WhyStale` file mode, compare `cache.Hash(targets[i])` to `ts.OutputHash` (treat hash error as stale). One test: build, overwrite target, assert stale, rebuild restores content. Blast: every file target. This is half of the content-hash sales pitch versus Make timestamps. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-001
    - p1
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
