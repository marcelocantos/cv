    context: 'Entropy-audit ENT-007 (P2). Status: observed fact. Agents and humans implementing from DESIGN.md will write `[verify]` rules that silently create a target named `[verify]`, expect macOS tracing, and expect a sandbox. STABILITY.md and agents-guide.md are closer to the binary and already disagree with DESIGN.md. Remediation: Either implement `[verify]` as a rule flag that sets `Executor.verify` for that target, or remove it from DESIGN.md / discovered-dependencies.md and parse unknown `[…]` as an error. Mark macOS trace and sandbox as non-goals in DESIGN.md to match STABILITY. Close or split T1.6… Blast: anyone using DESIGN.md as the spec (this repo''s README points there). Misparsed `[verify]` is a real graph mutation, not just missing behaviour. Report: docs/audits/entropy-audit-2026-08-22.md.'
