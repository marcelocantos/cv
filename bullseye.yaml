  T2.9:
    name: Mk → cv rename still has a tracked `.mk/` state file
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - '`git ls-files ''.mk/*''` is empty.'
    - 'ENT-009 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-009 (P2). Status: observed fact. A contributor without the local deletion can still have `.mk/state.json` in the tree. `.gitignore` will not prevent re-adding it. Dual state directories (`.mk/` vs `.cv/`) are a competing runtime SoT if an old binary and a new binary share a working tree. Remediation: stop tracking `.mk/state.json`; optionally ignore `.mk/` for a release or two. Rename the test. Do not touch the user''s current working-tree deletion as part of this audit. Blast: low for users of v0.10.0 (`stateDir = ".cv"` in `state.go:21`); high confusion during the rename window; dirty tree on this clone. Report: docs/audits/entropy-audit-2026-08-22.md.'
